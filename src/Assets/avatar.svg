<svg width="240px" height="260px" viewBox="0 0 240 260" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#5a189a" />
    </linearGradient>

    <!-- Suit Gradient -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c4048" />
      <stop offset="100%" stop-color="#212529" />
    </linearGradient>

    <!-- Lapel Gradient -->
    <linearGradient id="lapelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#495057" />
      <stop offset="100%" stop-color="#2b3035" />
    </linearGradient>

    <!-- Clip Path for Circle -->
    <clipPath id="circleClip">
      <circle cx="120" cy="130" r="110" />
    </clipPath>
  </defs>

  <!-- Background Circle with Purple Glow -->
  <circle cx="120" cy="130" r="110" fill="url(#bgGradient)" stroke="#c77dff" stroke-width="3" />

  <g clip-path="url(#circleClip)">
    <!-- Body / Shoulders -->
    <!-- Inner Shirt (Black) -->
    <path d="M90 190 L120 230 L150 190 L160 260 L80 260 Z" fill="#151719" />
    
    <!-- Shirt Collar V-neck -->
    <polygon points="120,215 106,182 134,182" fill="#222" />

    <!-- Suit Jacket (Charcoal grey like photo) -->
    <path d="M30 260 C35 210 65 190 92 185 L120 235 L148 185 C175 190 205 210 210 260 Z" fill="url(#suitGrad)" />
    
    <!-- Left & Right Lapels -->
    <polygon points="90,185 104,235 120,235 105,185" fill="url(#lapelGrad)" />
    <polygon points="150,185 136,235 120,235 135,185" fill="url(#lapelGrad)" />

    <!-- Neck -->
    <rect x="105" y="145" width="30" height="46" rx="8" fill="#dfb388" />
    <!-- Neck shadow under chin -->
    <ellipse cx="120" cy="155" rx="15" ry="6" fill="#c4976c" opacity="0.6" />

    <!-- Head / Face -->
    <!-- Ears -->
    <ellipse cx="71" cy="116" rx="7" ry="12" fill="#dfb388" />
    <ellipse cx="71" cy="116" rx="4" ry="7" fill="#c4976c" />
    <ellipse cx="169" cy="116" rx="7" ry="12" fill="#dfb388" />
    <ellipse cx="169" cy="116" rx="4" ry="7" fill="#c4976c" />

    <!-- Face Base -->
    <path d="M76 96 C76 66 84 56 120 56 C156 56 164 66 164 96 C164 135 152 160 120 160 C88 160 76 135 76 96 Z" fill="#e8c096" />

    <!-- Short Trimmed Full Beard & Mustache (matches Karim's photo) -->
    <!-- Beard jawline & chin -->
    <path d="M74 105 C74 136 84 163 120 163 C156 163 166 136 166 105 C166 112 163 126 158 136 C150 152 136 157 120 157 C104 157 90 152 82 136 C77 126 74 112 74 105 Z" fill="#231b18" />
    <!-- Mustache -->
    <path d="M104 133 C111 130 117 131 120 133 C123 131 129 130 136 133 C134 138 126 141 120 138 C114 141 106 138 104 133 Z" fill="#231b18" />
    <!-- Soul patch under lower lip -->
    <polygon points="117,143 123,143 120,148" fill="#231b18" />

    <!-- Mouth / Smile -->
    <path d="M110 136 Q120 144 130 136" stroke="#a35843" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M117 106 L115 122 Q120 126 125 122 L123 106" stroke="#c4976c" stroke-width="1.8" fill="none" stroke-linecap="round" />

    <!-- Eyes -->
    <!-- Left Eye -->
    <ellipse cx="98" cy="106" rx="6" ry="4.5" fill="#ffffff" />
    <circle cx="99" cy="106" r="3" fill="#2c1e19" />
    <circle cx="100.5" cy="104.5" r="1.2" fill="#ffffff" />

    <!-- Right Eye -->
    <ellipse cx="142" cy="106" rx="6" ry="4.5" fill="#ffffff" />
    <circle cx="141" cy="106" r="3" fill="#2c1e19" />
    <circle cx="142.5" cy="104.5" r="1.2" fill="#ffffff" />

    <!-- Eyebrows (Neat, masculine dark brown) -->
    <path d="M88 97 Q100 94 109 97" stroke="#231b18" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M152 97 Q140 94 131 97" stroke="#231b18" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Hair (Modern textured short crop with neat sides, matching Karim's photo) -->
    <path d="M72 98 C70 82 72 65 85 54 C98 44 142 44 155 54 C168 65 170 82 168 98 C165 80 162 67 150 60 C138 54 102 54 90 60 C78 67 75 80 72 98 Z" fill="#231b18" />
    <!-- Textured Hair top -->
    <path d="M82 60 C88 50 102 46 120 46 C138 46 152 50 158 60 C148 51 133 49 120 49 C107 49 92 51 82 60 Z" fill="#1b1412" />
    <path d="M96 52 Q120 45 144 52" stroke="#3d2c26" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>
</svg>
