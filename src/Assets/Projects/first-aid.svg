<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <linearGradient id="bgFirstAid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#0d2b45" />
      <stop offset="100%" stop-color="#05101e" />
    </linearGradient>
    <linearGradient id="aidAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="aidCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16385c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0c233c" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" rx="12" fill="url(#bgFirstAid)"/>

  <!-- Subtle Medical Wave / Grid -->
  <path d="M0 70 H600 M0 140 H600 M0 210 H600 M0 280 H600" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <path d="M100 0 V350 M200 0 V350 M300 0 V350 M400 0 V350 M500 0 V350" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Emergency Badge Tag -->
  <rect x="40" y="32" width="200" height="28" rx="14" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1"/>
  <text x="54" y="51" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#67e8f9">BILINGUAL VOICE RAG AGENT</text>

  <!-- Title -->
  <text x="40" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">AI First-Aid Assistant</text>
  <text x="40" y="120" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#38bdf8">Reciprocal Rank Fusion (RRF) &amp; Whisper STT Engine</text>

  <!-- Card 1: Evaluation Metrics -->
  <rect x="40" y="145" width="245" height="150" rx="10" fill="url(#aidCardGrad)" stroke="#0284c7" stroke-width="1.2"/>
  <text x="60" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#bae6fd">Ragas Evaluation</text>

  <text x="60" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#34d399">100%</text>
  <text x="150" y="208" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Faithfulness</text>

  <text x="60" y="255" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#38bdf8">98%</text>
  <text x="150" y="253" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Answer Relevancy</text>
  <text x="60" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">98% Precision@3 | 96% MRR</text>

  <!-- Card 2: Features & Tech -->
  <rect x="310" y="145" width="250" height="150" rx="10" fill="url(#aidCardGrad)" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="330" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#bfdbfe">Pipeline &amp; Stack</text>

  <g font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">
    <rect x="330" y="195" width="70" height="24" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="342" y="211" fill="#c7d2fe">Qdrant</text>

    <rect x="410" y="195" width="80" height="24" rx="6" fill="#042f2e" stroke="#14b8a6" stroke-width="1"/>
    <text x="420" y="211" fill="#99f6e4">Groq Whisper</text>

    <rect x="500" y="195" width="50" height="24" rx="6" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1"/>
    <text x="510" y="211" fill="#bae6fd">FastAPI</text>

    <rect x="330" y="230" width="70" height="24" rx="6" fill="#172554" stroke="#3b82f6" stroke-width="1"/>
    <text x="342" y="246" fill="#bfdbfe">Docker</text>

    <rect x="410" y="230" width="60" height="24" rx="6" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
    <text x="420" y="246" fill="#e9d5ff">Ragas</text>

    <rect x="480" y="230" width="70" height="24" rx="6" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
    <text x="490" y="246" fill="#e0e7ff">Pytest</text>
  </g>
  <text x="330" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Bilingual Arabic &amp; English Voice Search</text>

  <!-- Bottom Accent Line -->
  <rect x="0" y="344" width="600" height="6" fill="url(#aidAccent)"/>
</svg>

