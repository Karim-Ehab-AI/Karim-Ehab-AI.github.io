<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <linearGradient id="bgCandidate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f2d" />
      <stop offset="50%" stop-color="#1f1147" />
      <stop offset="100%" stop-color="#0b0819" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1b69" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#180e38" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" rx="12" fill="url(#bgCandidate)"/>
  
  <!-- Grid Lines -->
  <path d="M0 70 H600 M0 140 H600 M0 210 H600 M0 280 H600" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <path d="M100 0 V350 M200 0 V350 M300 0 V350 M400 0 V350 M500 0 V350" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Glowing Header Tag -->
  <rect x="40" y="32" width="165" height="28" rx="14" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
  <text x="54" y="51" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#d8b4fe">HYBRID RAG RETRIEVAL</text>

  <!-- Title -->
  <text x="40" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">AI Candidate Search &amp; Ranking</text>
  <text x="40" y="120" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#a78bfa">Explainable Multi-Vector Matching &amp; ATS Microservices</text>

  <!-- Dashboard Card 1: Score & Precision -->
  <rect x="40" y="145" width="245" height="150" rx="10" fill="url(#cardGrad)" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="60" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e9d5ff">Retrieval Metrics</text>
  
  <text x="60" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#4ade80">95.56%</text>
  <text x="170" y="208" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Precision@5</text>

  <text x="60" y="255" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#38bdf8">91.10%</text>
  <text x="170" y="253" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">NDCG@10</text>
  <text x="60" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Benchmarked on 150 CVs &amp; 30 JDs</text>

  <!-- Dashboard Card 2: Tech Badges -->
  <rect x="310" y="145" width="250" height="150" rx="10" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2"/>
  <text x="330" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fbcfe8">Architecture Stack</text>

  <!-- Tech tags -->
  <g font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">
    <rect x="330" y="195" width="70" height="24" rx="6" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
    <text x="342" y="211" fill="#e9d5ff">Qdrant</text>

    <rect x="410" y="195" width="70" height="24" rx="6" fill="#042f2e" stroke="#14b8a6" stroke-width="1"/>
    <text x="422" y="211" fill="#99f6e4">FastAPI</text>

    <rect x="490" y="195" width="60" height="24" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="502" y="211" fill="#fecaca">Redis</text>

    <rect x="330" y="230" width="80" height="24" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="338" y="246" fill="#c7d2fe">LangChain</text>

    <rect x="420" y="230" width="70" height="24" rx="6" fill="#172554" stroke="#3b82f6" stroke-width="1"/>
    <text x="432" y="246" fill="#bfdbfe">Docker</text>

    <rect x="500" y="230" width="50" height="24" rx="6" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1"/>
    <text x="510" y="246" fill="#bae6fd">Azure</text>
  </g>
  <text x="330" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Explainable Score Breakdown</text>

  <!-- Bottom Accent Line -->
  <rect x="0" y="344" width="600" height="6" fill="url(#accentGrad)"/>
</svg>

